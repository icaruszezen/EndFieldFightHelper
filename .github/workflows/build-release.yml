name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish -c Release -o ./publish -p:Version=0.1.${{ github.run_number }}

      - name: Remove runtime-downloaded resources
        run: |
          if (Test-Path ./publish/Resources/public) {
            Remove-Item -Path ./publish/Resources/public -Recurse -Force
          }

      - name: Create zip artifact
        run: Compress-Archive -Path ./publish/* -DestinationPath EndFieldFightHelper-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: EndFieldFightHelper v0.1.${{ github.run_number }}
          files: EndFieldFightHelper-win-x64.zip
          generate_release_notes: true
